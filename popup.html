<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <main class="main">
      <section class="target-card card">
        <div class="card-header">
          <span class="section-title">Target tab</span>
          <div class="header-badges">
            <span id="bridge-status" class="bridge-badge bridge-offline" title="Bridge connection status">● Bridge Offline</span>
            <span id="target-id" class="id-badge">—</span>
          </div>
        </div>

        <div class="target-meta">
          <div id="target-title" class="target-name">No tab locked</div>
          <div id="target-url" class="target-link" title="">Lock a tab to get started</div>
        </div>

        <div class="action-grid">
          <button id="btn-toggle-lock" class="btn btn-primary">
            <span class="btn-icon" aria-hidden="true">◎</span>
            <span class="btn-text">Lock current tab</span>
          </button>
          <button id="btn-add-group" class="btn btn-secondary">
            <span class="btn-icon" aria-hidden="true">+</span>
            <span class="btn-text">Add current tab to group</span>
          </button>
        </div>
      </section>

      <section class="tools-card card">
        <div class="card-header">
          <span class="section-title">Quick actions</span>
        </div>
        <div class="tools-list">
          <button id="btn-highlight-target" class="tool-btn">
            <span class="tool-icon" aria-hidden="true">↗</span>
            <span class="tool-copy"><strong>Focus target</strong><small>Bring the locked tab forward</small></span>
            <span class="tool-arrow" aria-hidden="true">›</span>
          </button>
          <button id="btn-toggle-som" class="tool-btn">
            <span class="tool-icon" aria-hidden="true">#</span>
            <span class="tool-copy"><strong>Toggle element IDs</strong><small>Show or hide clickable targets</small></span>
            <span class="tool-arrow" aria-hidden="true">›</span>
          </button>
          <button id="btn-copy-url" class="tool-btn">
            <span class="tool-icon" aria-hidden="true">□</span>
            <span class="tool-copy"><strong>Copy target URL</strong><small>Copy the active page address</small></span>
            <span class="tool-arrow" aria-hidden="true">›</span>
          </button>
        </div>
      </section>
    </main>

  </div>
  <script src="popup.js"></script>
</body>
</html>
