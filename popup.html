<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-orb">👻</div>
        <div class="brand-text">
          <div class="title-row">
            <h1>SPECTER</h1>
            <span class="version-tag">v1.3.0</span>
          </div>
          <p class="subtitle">Ghost-Cursor Automation</p>
        </div>
      </div>
      <div id="bridge-badge" class="status-pill offline">
        <span class="status-dot"></span>
        <span class="status-label">Offline</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Target Tab Card -->
      <section class="card target-card">
        <div class="card-header">
          <span class="section-title">Active Target</span>
          <span id="target-id" class="id-badge">—</span>
        </div>

        <div class="target-meta">
          <div id="target-title" class="target-name">No tab locked</div>
          <div id="target-url" class="target-link" title="">Click Lock to attach</div>
        </div>

        <div class="action-grid">
          <button id="btn-toggle-lock" class="btn btn-primary">
            <span class="btn-icon">🎯</span>
            <span class="btn-text">Lock Current Tab</span>
          </button>
          <button id="btn-create-worker" class="btn btn-secondary">
            <span class="btn-icon">➕</span>
            <span class="btn-text">New Worker</span>
          </button>
        </div>
      </section>

      <!-- Quick Actions Grid -->
      <section class="card tools-card">
        <div class="card-header">
          <span class="section-title">Tab Controls</span>
        </div>

        <div class="tools-grid">
          <button id="btn-highlight-target" class="tool-btn">
            <span class="tool-icon">👀</span>
            <span class="tool-label">Focus Tab</span>
          </button>
          <button id="btn-toggle-som" class="tool-btn">
            <span class="tool-icon">🔢</span>
            <span class="tool-label">SOM IDs</span>
          </button>
          <button id="btn-copy-url" class="tool-btn">
            <span class="tool-icon">📋</span>
            <span class="tool-label">Copy URL</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-wrapper">
        <span class="pulse-indicator"></span>
        <span id="status">Ready</span>
      </div>
      <div class="port-tag">127.0.0.1:8765</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
